<style>
/* LAYOUT CONCEPT
   Black screen, one centred Start button. The button opens a Luna-style window
   that holds the only form. */

@font-face{font-family:"Franklin";font-style:normal;font-weight:100 900;font-display:swap;src:url(assets/fonts/libre-franklin-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

:root{
  /* colour: sampled from the sticker sheet */
  --hill:#0ba14b;
  --hill-deep:#0b7e4b;
  --sun:#ffde16;
  --pink:#f5bbd6;
  --gold:#bf9b30;
  --ink:#0b2540;
  /* Luna chrome */
  --xp-blue:#0a4fdc;
  --xp-beige:#ece9d8;
  /* type */
  --display:"Franklin","Helvetica Neue",Arial,sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --btn-h:clamp(72px,8.6vw,104px);
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;overflow:hidden;
  background:#000;color:var(--ink);
  font:500 15px/1.4 var(--display);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ───────── scene: black, one button ───────── */
.scene{position:relative;width:100%;height:100%;min-height:420px;overflow:hidden;isolation:isolate;background:#000}
.layer{position:absolute;inset:0;pointer-events:none}
.hero{position:absolute;inset:0;z-index:8;display:grid;place-items:center;pointer-events:none}
.start-wrap{pointer-events:auto;animation:fade .9s ease .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}

.start{
  display:inline-flex;align-items:center;justify-content:center;gap:11px;
  height:54px;padding:0 30px;border:0;border-radius:999px;cursor:pointer;
  background:linear-gradient(180deg,#18a95a 0%,#0b8a47 55%,#09733c 100%);
  color:#fff;font:italic 800 24px/1 var(--display);letter-spacing:-.02em;
  text-shadow:0 1px 2px rgba(0,40,15,.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 4px rgba(0,40,15,.3);
  transition:filter .2s ease,translate .1s ease;
  -webkit-user-select:none;user-select:none;
}
.start:hover{filter:brightness(1.12)}
.start:active,.start[aria-expanded="true"]{translate:0 1px;filter:brightness(.92)}
.start:focus-visible{outline:2px solid #fff;outline-offset:4px}
.start .flag{width:24px;height:24px;flex:none;rotate:-6deg;filter:drop-shadow(0 1px 1px rgba(0,40,15,.5))}

/* ───────── Luna window ───────── */
.win{
  position:absolute;left:50%;top:50%;z-index:10;
  width:min(480px,calc(100% - 32px));max-height:calc(100% - 24px);
  display:flex;flex-direction:column;
  translate:calc(-50% + var(--dx,0px)) calc(-50% + var(--dy,0px));
  border-radius:10px 10px 4px 4px;overflow:hidden;
  background:var(--xp-blue);
  box-shadow:0 0 0 1px #00219c,0 30px 70px rgba(0,0,0,.7);
  transform-origin:50% 62%;
}
.win[hidden]{display:none}
.win.is-opening{animation:winIn .55s cubic-bezier(.2,1.25,.3,1) both}
.win.is-closing{animation:winOut .2s ease-in both}
.win.is-wobble{animation:wobble .5s ease both}
@keyframes winIn{from{scale:.14;opacity:0;rotate:-4deg}45%{opacity:1}to{scale:1;opacity:1;rotate:0deg}}
@keyframes winOut{from{scale:1;opacity:1}to{scale:.14;opacity:0}}
@keyframes wobble{0%,100%{rotate:0deg}20%{rotate:-1.6deg}45%{rotate:1.4deg}70%{rotate:-.7deg}}

.bar{
  flex:none;display:flex;align-items:center;gap:7px;height:32px;padding:0 5px 0 8px;touch-action:none;cursor:default;
  -webkit-user-select:none;user-select:none;
  background:linear-gradient(180deg,#0997ff 0%,#0053ee 9%,#0050ee 42%,#0066ff 86%,#0066ff 92%,#005bff 95%,#003dd7 98%,#003dd7 100%);
  border-bottom:1px solid #0030b8;
}
.bar .ico{flex:none;width:18px;height:18px}
.bar h2{margin:0;flex:1;min-width:0;font:800 14px/1 var(--display);letter-spacing:.01em;color:#fff;text-shadow:1px 1px 0 #0f1089;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{
  flex:none;display:grid;place-items:center;width:22px;height:22px;padding:0;cursor:pointer;
  border:1px solid #fff;border-radius:4px;
  background:radial-gradient(circle at 28% 22%,#7bb1ff 0%,#2a63df 55%,#1b44b8 100%);
  box-shadow:inset 0 -1px 2px rgba(0,0,30,.35);
}
.tb svg{width:12px;height:12px;display:block}
.tb:hover{filter:brightness(1.18)}
.tb:active{filter:brightness(.85)}
.tb--x{background:radial-gradient(circle at 28% 22%,#f4b09a 0%,#d6522b 55%,#b02808 100%)}
.tb:focus-visible{outline:2px solid #fff;outline-offset:1px}

.win__body{
  display:flex;flex-direction:column;min-height:0;overflow:auto;
  margin:0 4px 4px;background:var(--xp-beige);
}
.head{
  display:flex;gap:16px;align-items:center;justify-content:space-between;
  padding:18px 18px 16px 20px;background:#fff;border-bottom:1px solid #aca899;
  box-shadow:0 1px 0 #fff;
}
.head h3{margin:0 0 6px;font:italic 900 clamp(22px,5.4vw,27px)/1.02 var(--display);letter-spacing:-.025em;word-spacing:.1em;color:var(--ink);text-wrap:balance}
.head p{margin:0;font-size:13.5px;line-height:1.45;color:#3b4a5c;max-width:30ch;text-wrap:pretty}
.head .sticker{flex:none;width:96px;height:auto;rotate:7deg;filter:drop-shadow(2px 3px 0 rgba(11,37,64,.2))}

.pane{padding:18px 20px 20px;min-height:172px}
.pane[hidden]{display:none}
.field label{display:block;margin:0 0 7px;font-weight:700;font-size:13px}
.field input[type=email]{
  display:block;width:100%;height:38px;padding:0 11px;
  font-size:16px;font-weight:500;color:#000;background:#fff;
  border:1px solid #7f9db9;border-radius:2px;
  box-shadow:inset 1px 1px 0 #d4d0c8;
}
.field input[type=email]::placeholder{color:#8794a3}
.field input[type=email]:focus{outline:0;border-color:#2b6cc4;box-shadow:inset 1px 1px 0 #d4d0c8,0 0 0 3px rgba(51,170,225,.55)}
.field input[aria-invalid=true]{border-color:#c0391b}
.hint{margin:9px 0 0;font-size:12px;line-height:1.4;color:#5b6675}
.err{display:flex;gap:7px;align-items:flex-start;margin:9px 0 0;font-size:12.5px;font-weight:700;line-height:1.35;color:#b3260c}
.err[hidden]{display:none}
.err svg{flex:none;width:16px;height:16px;margin-top:-1px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.xpbtn{
  min-width:92px;height:29px;padding:0 16px;cursor:pointer;
  font:600 13px/1 var(--display);color:#000;
  border:1px solid #003c74;border-radius:3px;
  background:linear-gradient(180deg,#fff 0%,#f5f4ef 55%,#dcd7ca 100%);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.05);
}
.xpbtn:hover{box-shadow:inset 0 0 0 2px #f8b330,inset 0 -2px 0 rgba(0,0,0,.05)}
.xpbtn:active{background:linear-gradient(180deg,#d6d1c3,#e8e5da);box-shadow:inset 1px 1px 2px rgba(0,0,0,.25)}
.xpbtn--main{box-shadow:inset 0 0 0 2px #8fb4f0,inset 0 -2px 0 rgba(0,0,0,.05)}
.xpbtn--main:hover{box-shadow:inset 0 0 0 2px #f8b330}
.xpbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.prog{height:20px;padding:2px;background:#fff;border:1px solid #686868;border-radius:4px;box-shadow:inset 1px 1px 2px rgba(0,0,0,.2);overflow:hidden;position:relative}
.prog b{
  position:absolute;top:2px;bottom:2px;left:2px;width:96px;border-radius:2px;
  background:repeating-linear-gradient(90deg,transparent 0 1px,#fff 1px 2px,transparent 2px 8px),linear-gradient(180deg,#9dec9a 0%,#37c437 40%,#1fa31f 100%);
  background-blend-mode:normal;
  -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 10px);mask-image:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 10px);
  animation:march 1.15s linear infinite;
}
@keyframes march{from{left:-100px}to{left:100%}}
.done{display:flex;gap:16px;align-items:center}
.done svg{flex:none;width:54px;height:54px;filter:drop-shadow(2px 3px 0 rgba(11,37,64,.22))}
.done p{margin:0;min-width:0;font-size:13.5px;line-height:1.5;color:#3b4a5c;overflow-wrap:anywhere}
.done strong{color:#000;font-size:15px}
.pane[data-pane=busy]:not([hidden]){display:flex;flex-direction:column;justify-content:center}

/* ───────── falling stickers ───────── */
.rain{z-index:9;overflow:hidden}
.sticker-fall{position:absolute;display:block;height:auto;will-change:transform}

/* ───────── small screens ───────── */
@media (max-width:620px){
  .head{padding:16px 16px 14px}
  .head .sticker{width:76px}
  .pane{padding:16px}
}
@media (prefers-reduced-motion:reduce){
  .start-wrap,.prog b{animation:none!important}
  .win.is-opening,.win.is-closing,.win.is-wobble{animation:none!important}
  .prog b{left:30%}
}
</style>
</head>

<main class="scene" id="scene">
  <h1 class="sr-only">drop</h1>

  <div class="hero">
    <div class="start-wrap">
      <button class="start" id="start" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="win" aria-label="Start: prijava za prvi drop">
        <svg class="flag" aria-hidden="true"><use href="#flag"/></svg>
        <span>start</span>
      </button>
    </div>
  </div>

  <div class="layer rain" id="rain" aria-hidden="true"></div>

  <section class="win" id="win" role="dialog" aria-labelledby="win-title" aria-describedby="win-desc" tabindex="-1" hidden>
    <div class="bar" id="bar">
      <svg class="ico" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="#5cbbe7"/><use href="#logo-mono" x="8.5" y="5.5" width="16" height="20.2"/></svg>
      <h2 id="win-title">drop.exe</h2>
      <button class="tb" type="button" id="btn-min" aria-label="Smanji"><svg viewBox="0 0 12 12"><path d="M2 9h6" stroke="#fff" stroke-width="2.4"/></svg></button>
      <button class="tb" type="button" id="btn-max" aria-label="Povećaj"><svg viewBox="0 0 12 12" fill="none"><rect x="2" y="2" width="8" height="8" stroke="#fff" stroke-width="1.6"/><path d="M2 2.8h8" stroke="#fff" stroke-width="2.4"/></svg></button>
      <button class="tb tb--x" type="button" id="btn-x" aria-label="Zatvori"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    </div>

    <div class="win__body" id="body" data-view="form">
      <header class="head">
        <div>
          <h3 id="head-title">Prvi drop stiže uskoro.</h3>
          <p id="win-desc">Upiši svoj e-mail. Javit ćemo ti se čim bude spremno za kupnju.</p>
        </div>
        <svg class="sticker" viewBox="0 0 276 148" aria-hidden="true"><ellipse cx="138" cy="74" rx="137.5" ry="73.5" fill="#5cbbe7"/><use href="#logo-word" x="33" y="20" width="210" height="106"/></svg>
      </header>

      <form class="pane" id="form" data-pane="form" novalidate autocomplete="on">
        <div class="field">
          <label for="email">E-mail adresa:</label>
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="ime@mail.com" required aria-describedby="hint err">
          <p class="err" id="err" role="alert" hidden><svg aria-hidden="true"><use href="#i-err"/></svg><span id="err-txt"></span></p>
          <p class="hint" id="hint">Koristimo ga samo za obavijest o dropu.</p>
          <input class="hp" id="hp-field" name="hp_field" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
        </div>
        <div class="foot">
          <button class="xpbtn xpbtn--main" type="submit" id="send">Prijavi me</button>
          <button class="xpbtn" type="button" data-close>Zatvori</button>
        </div>
      </form>

      <div class="pane" data-pane="busy" hidden aria-live="polite">
        <div class="prog" role="progressbar" aria-label="Spremam tvoju prijavu"><b></b></div>
      </div>

      <div class="pane" data-pane="done" hidden aria-live="polite">
        <div class="done">
          <svg viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="27" r="25" fill="url(#g-ok)" stroke="#fff" stroke-width="2.5"/><path d="M15.5 28l8 8 15.5-17.5" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <p>Prijavljena adresa:<br><strong id="done-mail"></strong></p>
        </div>
        <div class="foot"><button class="xpbtn xpbtn--main" type="button" data-close>Zatvori</button></div>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  'use strict';

  /* ── Email capture ───────────────────────────────────────────────
     Put your form endpoint here (Formspree, Buttondown, Mailchimp,
     Google Apps Script, your own API). It receives a JSON POST:
       { email, source, ts }
     While this is empty the page runs in demo mode: the address is only
     kept in this browser's localStorage and nothing is sent anywhere.   */
  const CONFIG = { endpoint: '' };

  const $ = (s, r = document) => r.querySelector(s);
  const scene = $('#scene'), btn = $('#start');
  const win = $('#win'), bar = $('#bar'), body = $('#body');
  const form = $('#form'), email = $('#email'), err = $('#err'), errTxt = $('#err-txt'), hp = $('#hp-field');
  const headTitle = $('#head-title'), headDesc = $('#win-desc');
  const rain = $('#rain');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fine = matchMedia('(pointer: fine)').matches;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const copy = {
    form: ['Prvi drop stiže uskoro.', 'Upiši svoj e-mail. Javit ćemo ti se čim bude spremno za kupnju.'],
    busy: ['Samo trenutak.', 'Spremamo tvoju prijavu.'],
    done: ['Zapisali smo te.', 'Javit ćemo ti se čim prvi drop bude spreman.']
  };

  /* ── window state ── */
  function setView(v) {
    body.dataset.view = v;
    document.querySelectorAll('[data-pane]').forEach(p => { p.hidden = p.dataset.pane !== v; });
    headTitle.textContent = copy[v][0];
    headDesc.textContent = copy[v][1];
  }
  function openWin() {
    if (!win.hidden && !win.classList.contains('is-closing')) { email.focus(); return; }
    if (body.dataset.view === 'done') { form.reset(); setView('form'); }
    win.hidden = false;
    win.classList.remove('is-closing');
    void win.offsetWidth;
    win.classList.add('is-opening');
    btn.setAttribute('aria-expanded', 'true');
    requestAnimationFrame(() => { if (fine) email.focus({ preventScroll: true }); else win.focus({ preventScroll: true }); });
  }
  function closeWin() {
    if (win.hidden || win.classList.contains('is-closing')) return;
    win.classList.remove('is-opening');
    btn.setAttribute('aria-expanded', 'false');
    const end = () => { win.hidden = true; win.classList.remove('is-closing'); btn.focus({ preventScroll: true }); };
    if (reduce) return end();
    win.classList.add('is-closing');
    win.addEventListener('animationend', end, { once: true });
  }
  function wobble() {
    if (reduce) return;
    win.classList.remove('is-opening', 'is-wobble'); void win.offsetWidth; win.classList.add('is-wobble');
  }

  btn.addEventListener('click', () => (win.hidden ? openWin() : closeWin()));
  win.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeWin));
  $('#btn-x').addEventListener('click', closeWin);
  $('#btn-min').addEventListener('click', closeWin);
  $('#btn-max').addEventListener('click', wobble);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !win.hidden) closeWin(); });

  /* ── drag by title bar ── */
  let drag = null, dx = 0, dy = 0;
  bar.addEventListener('pointerdown', e => {
    if (e.target.closest('.tb')) return;
    drag = { x: e.clientX, y: e.clientY, dx, dy };
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener('pointermove', e => {
    if (!drag) return;
    const s = scene.getBoundingClientRect(), w = win.getBoundingClientRect();
    let nx = drag.dx + e.clientX - drag.x, ny = drag.dy + e.clientY - drag.y;
    const mx = nx - dx, my = ny - dy; // proposed delta from current position
    const left = w.left - s.left + mx, top = w.top - s.top + my;
    if (left < -w.width + 120) nx -= left + w.width - 120;
    if (left > s.width - 120) nx -= left - (s.width - 120);
    if (top < 0) ny -= top;
    if (top > s.height - 40) ny -= top - (s.height - 40);
    dx = nx; dy = ny;
    win.style.setProperty('--dx', dx + 'px'); win.style.setProperty('--dy', dy + 'px');
  });
  const endDrag = () => { drag = null; };
  bar.addEventListener('pointerup', endDrag); bar.addEventListener('pointercancel', endDrag);

  /* ── form ── */
  const valid = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  function showErr(msg) {
    errTxt.textContent = msg; err.hidden = false;
    email.setAttribute('aria-invalid', 'true'); email.focus();
    wobble();
  }
  function clearErr() { err.hidden = true; email.removeAttribute('aria-invalid'); }
  email.addEventListener('input', clearErr);

  async function send(address) {
    const payload = { email: address, source: 'drop.hr', ts: new Date().toISOString() };
    if (!CONFIG.endpoint) {
      try {
        const list = JSON.parse(localStorage.getItem('drop:emails') || '[]');
        list.push(payload); localStorage.setItem('drop:emails', JSON.stringify(list));
      } catch (_) { /* storage unavailable, demo mode only */ }
      console.info('[drop] demo mode: set CONFIG.endpoint to collect emails.', payload);
      return;
    }
    const res = await fetch(CONFIG.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const v = email.value.trim();
    if (!valid(v)) { showErr('Upiši ispravnu e-mail adresu.'); return; }
    clearErr();
    setView('busy');
    const t0 = performance.now();
    let ok = true;
    if (!hp.value) { try { await send(v); } catch (_) { ok = false; } }   // honeypot filled = bot, fake success
    await sleep(Math.max(0, 1500 - (performance.now() - t0)));
    if (ok) { $('#done-mail').textContent = v; setView('done'); dropStickers(); win.querySelector('[data-pane=done] .xpbtn').focus({ preventScroll: true }); }
    else { setView('form'); showErr('Nešto nije u redu. Pokušaj ponovno.'); }
  });

  /* ── falling stickers ── */
  const WAYS = [
    { bg: '#5cbbe7' },
    { bg: '#0ba14b' },
    { bg: '#0ba14b', ring: '#ffde16' },
    { bg: '#bf9b30', ring: '#ffdc73' },
    { bg: '#f5bbd6' },
    { bg: '#0b7e4b' }
  ];
  const sticker = w => `<svg viewBox="0 0 276 148" aria-hidden="true">${
    w.ring ? `<ellipse cx="138" cy="74" rx="137.5" ry="73.5" fill="${w.ring}"/><ellipse cx="138" cy="74" rx="125" ry="61.5" fill="${w.bg}"/>`
           : `<ellipse cx="138" cy="74" rx="137.5" ry="73.5" fill="${w.bg}"/>`
  }<use href="#logo-word" x="33" y="20" width="210" height="106"/></svg>`;
  let rained = 0;
  function dropStickers() {
    if (rained > 60) return;
    const W = scene.clientWidth, H = scene.clientHeight;
    const n = W < 620 ? 14 : 24;
    const base = Math.max(86, Math.min(150, W * .1));
    for (let i = 0; i < n; i++) {
      const w = base * (.75 + Math.random() * .6), h = w * 148 / 276;
      const x = Math.random() * (W - w), land = H * (.7 + Math.random() * .24) - h / 2;
      const rot = (Math.random() - .5) * 56, spin = (Math.random() - .5) * 240;
      const el = document.createElement('div');
      el.className = 'sticker-fall';
      el.style.cssText = `left:${x}px;top:${land}px;width:${w}px;z-index:${Math.round(land)};rotate:${rot}deg`;
      el.innerHTML = sticker(WAYS[(Math.random() * WAYS.length) | 0]);
      el.firstChild.style.display = 'block';
      rain.appendChild(el);
      rained++;
      if (reduce) continue;
      const from = -(land + h + 60);
      el.animate([
        { transform: `translateY(${from}px) rotate(${spin}deg)`, offset: 0, easing: 'cubic-bezier(.55,0,.9,.55)' },
        { transform: 'translateY(0) rotate(0deg)', offset: .62, easing: 'cubic-bezier(.2,.7,.4,1)' },
        { transform: `translateY(${-h * .32}px) rotate(${spin * .06}deg)`, offset: .8, easing: 'cubic-bezier(.6,0,.9,.6)' },
        { transform: 'translateY(0) rotate(0deg)', offset: 1 }
      ], { duration: 1500 + Math.random() * 700, delay: i * 65 + Math.random() * 120, fill: 'backwards' });
    }
  }
})();
</script>
</body>
</html>
